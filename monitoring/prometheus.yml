global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node.json"]
        refresh_interval: 1m

  - job_name: task-api
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/task-api.json"]
        refresh_interval: 1m
